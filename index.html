<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>報名已經截止</title>
<style>
  :root {
    --bg: #FAF6ED;
    --paper: #FFFDF7;
    --dark: #2A2520;
    --brown: #3D3020;
    --gold: #D4A82A;
    --gold-deep: #A07818;
    --line: #EAD9A8;
    --gray: #757575;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--brown);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 30px -14px rgba(42, 37, 32, 0.25);
    text-align: center;
  }
  .card-top {
    background: var(--dark);
    padding: 34px 32px 30px;
  }
  .card-top h1 {
    margin: 0;
    font-size: 36px;
    line-height: 1.3;
    font-weight: 900;
    color: #FDF6DC;
    letter-spacing: 0.04em;
  }
  .card-top .bar {
    width: 56px;
    height: 5px;
    border-radius: 3px;
    background: var(--gold);
    margin: 18px auto 0;
  }
  .card-body { padding: 10px 32px 14px; }
  .msg { padding: 26px 0; }
  .msg + .msg { border-top: 1px solid var(--line); }
  .msg p { margin: 0; }

  .tw p {
    font-size: 26px;
    line-height: 1.8;
    font-weight: 700;
    color: var(--brown);
  }
  .tw a {
    color: var(--gold-deep);
    font-weight: 900;
    text-decoration: underline;
    text-underline-offset: 5px;
    text-decoration-thickness: 2px;
  }
  .tw a:hover { color: var(--dark); }

  .zh p {
    font-size: 15px;
    line-height: 1.8;
    color: var(--gray);
  }
  .zh a {
    color: var(--gray);
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .zh a:hover { color: var(--dark); }

  .msg a:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 3px;
    border-radius: 3px;
  }
  @media (max-width: 420px) {
    .card-top { padding: 28px 22px 24px; }
    .card-top h1 { font-size: 30px; }
    .card-body { padding: 6px 22px 10px; }
    .tw p { font-size: 22px; }
    .zh p { font-size: 14px; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="card-top">
      <h1>報名已經截止</h1>
      <div class="bar"></div>
    </div>
    <div class="card-body">
      <section class="msg tw">
        <p>這擺活動 ê 報名已經截止矣。若有啥物問題，歡迎加入<a href="https://lin.ee/jqY7HN9j?openExternalBrowser=1" target="_blank" rel="noopener">官方LINE</a>來問！多謝！</p>
      </section>
      <section class="msg zh">
        <p>本活動報名已經截止，有任何問題歡迎加入<a href="https://lin.ee/jqY7HN9j?openExternalBrowser=1" target="_blank" rel="noopener">官方LINE</a>詢問！謝謝！</p>
      </section>
    </div>
  </main>
</body>
</html>
